<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Wortspiel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap');

  :root {
    --bg: #EDEFEA;
    --panel: #F6F4EC;
    --tile: #FBF8F2;
    --tile-border: #D9CBAA;
    --tile-shadow: #C9B98D;
    --ink: #2B2E28;
    --ink-soft: #5B6157;
    --sage: #4F6F52;
    --sage-dark: #3A5A3D;
    --sage-bg: #E4ECE2;
    --ochre: #A6754B;
    --ochre-bg: #F1E4D3;
    --amber: #B9812E;
    --amber-bg: #FBEEDA;
    --mj-red: #C0392B;
    --mj-blue: #2E6B8F;
    --mj-purple: #7D5896;
    --mj-teal: #2F8F80;
    --font-display: 'Fredoka', system-ui, sans-serif;
    --font-body: 'Work Sans', system-ui, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    font-family: var(--font-body);
    color: var(--ink);
    min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 20px 60px; }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--sage); font-family: var(--font-display); font-weight: 600;
    font-size: 14px; letter-spacing: 1px; text-transform: uppercase;
  }
  h1 {
    font-family: var(--font-display); font-weight: 700; font-size: 32px;
    margin: 6px 0 4px; color: var(--ink);
  }
  .subtitle { color: var(--ink-soft); font-size: 17px; margin: 0; line-height: 1.5; }
  .header { text-align: center; margin-bottom: 22px; }

  .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 22px; }
  .tab-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 20px; border-radius: 999px; border: none; cursor: pointer;
    font-family: var(--font-body); font-weight: 600; font-size: 16px;
    background: var(--panel); color: var(--ink-soft);
    transition: all 0.2s;
  }
  .tab-btn.active { background: var(--sage); color: #fff; box-shadow: 0 2px 8px rgba(79,111,82,0.35); }

  .tiles { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .tile {
    width: 62px; height: 62px; border-radius: 14px;
    background: var(--tile); border: 2px solid var(--tile-border);
    box-shadow: 0 3px 0 var(--tile-shadow);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 30px; color: var(--ink);
    animation: tileIn 0.45s ease both;
  }
  @keyframes tileIn { from { opacity: 0; transform: translateY(10px) rotate(-3deg) scale(0.9); } to { opacity: 1; transform: translateY(0) rotate(0) scale(1); } }
  @keyframes popIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }

  .controls-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 22px; align-items: center; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--tile-border);
    background: #fff; color: var(--ink-soft); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .timer-badge {
    display: flex; align-items: center; padding: 0 16px; border-radius: 999px;
    background: var(--panel); font-family: var(--font-display); font-weight: 600; font-size: 18px; color: var(--ink);
  }

  form.entry-form { display: flex; gap: 10px; margin-bottom: 12px; }
  #word-input {
    flex: 1; font-size: 20px; padding: 14px 18px; border-radius: 14px;
    border: 2px solid var(--tile-border); background: #fff; color: var(--ink);
    font-family: var(--font-body);
  }
  #word-input:disabled { opacity: 0.6; }
  .btn-primary {
    padding: 13px 30px; border-radius: 14px; border: none; cursor: pointer;
    background: var(--sage); color: #fff; font-family: var(--font-display); font-weight: 600; font-size: 17px;
  }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  #add-btn { padding: 0 24px; border-radius: 14px; border: none; cursor: pointer;
    background: var(--sage); color: #fff; font-family: var(--font-body); font-weight: 600; font-size: 17px; }
  #add-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  #message {
    min-height: 44px; display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: 12px; font-size: 16px; font-weight: 500;
    margin-bottom: 20px; color: var(--ink-soft);
  }
  #message.tone-amber { color: var(--amber); background: var(--amber-bg); }
  #message.tone-sage { color: var(--sage-dark); background: var(--sage-bg); }

  .shelf { background: var(--panel); border-radius: 18px; padding: 18px; margin-bottom: 18px; }
  .shelf-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .shelf-title { font-family: var(--font-display); font-weight: 600; font-size: 18px; color: var(--ink); }
  .shelf-score { font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--sage); }
  .shelf-empty { color: var(--ink-soft); font-size: 15px; margin: 0; }
  .shelf-words { display: flex; flex-wrap: wrap; gap: 8px; }
  .word-chip {
    display: flex; align-items: center; gap: 6px;
    background: #fff; border: 1.5px solid var(--tile-border);
    border-radius: 10px; padding: 6px 12px; font-size: 16px; font-weight: 500;
    animation: popIn 0.3s ease both;
  }
  .word-chip.bonus { background: var(--ochre-bg); border-color: var(--ochre); }
  .word-chip .pts { color: var(--ink-soft); font-size: 13px; }
  .word-chip .star { color: var(--ochre); }

  .best-note { text-align: center; color: var(--ink-soft); font-size: 14px; margin-bottom: 20px; }
  .round-actions { display: flex; justify-content: center; gap: 10px; }

  .settings { margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--tile-border); }
  .settings-title { font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--ink-soft); margin-bottom: 10px; text-align: center; }
  .settings-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .pill-btn {
    padding: 8px 16px; border-radius: 999px; border: 2px solid var(--tile-border);
    background: #fff; color: var(--ink); font-family: var(--font-body); font-weight: 600;
    cursor: pointer; font-size: 15px;
  }
  .pill-btn.selected { border-color: var(--sage); background: var(--sage-bg); }
  .pill-btn.timer-on { border-color: var(--ochre); background: var(--ochre-bg); }
  .settings-center { text-align: center; }

  .board-empty { text-align: center; color: var(--ink-soft); font-size: 16px; margin-top: 40px; }
  .board-list { display: flex; flex-direction: column; gap: 10px; }
  .board-row { display: flex; align-items: center; gap: 14px; background: var(--panel); border-radius: 14px; padding: 12px 16px; }
  .board-row.own { border: 2px solid var(--sage); }
  .board-rank {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    background: var(--sage-bg); color: var(--sage-dark);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 15px;
  }
  .board-row:first-child .board-rank { background: var(--ochre); color: #fff; }
  .board-main { flex: 1; }
  .board-score { font-family: var(--font-display); font-weight: 600; font-size: 17px; color: var(--ink); }
  .board-meta { font-size: 13px; color: var(--ink-soft); }
  .board-section-title { font-family: var(--font-display); font-weight: 600; font-size: 16px; color: var(--ink); margin: 0 0 12px; text-align: center; }
  .board-tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }

  #play-view.hidden, #board-view.hidden, #memory-view.hidden, #cardmemory-view.hidden, #mahjong-view.hidden, #simon-view.hidden { display: none; }

  .memory-items { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
  .memory-card {
    min-width: 110px; padding: 16px 18px; border-radius: 14px;
    background: var(--tile); border: 2px solid var(--tile-border);
    box-shadow: 0 3px 0 var(--tile-shadow);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--ink);
    animation: tileIn 0.45s ease both; text-align: center;
  }
  .memory-card.hidden-card { color: var(--ink-soft); font-size: 30px; background: var(--panel); }
  .memory-prompt { text-align: center; margin-bottom: 20px; }
  .memory-prompt .big { font-family: var(--font-display); font-weight: 700; font-size: 26px; color: var(--ink); margin-bottom: 6px; }
  .memory-prompt .sub { color: var(--ink-soft); font-size: 15px; }
  .memory-letter-input {
    display: block; margin: 14px auto; width: 90px; text-align: center;
    font-size: 32px; font-family: var(--font-display); font-weight: 700;
    padding: 10px; border-radius: 14px; border: 2px solid var(--tile-border);
    text-transform: uppercase;
  }
  .memory-recall-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  @media (max-width: 460px) { .memory-recall-grid { grid-template-columns: 1fr; } }
  .memory-recall-input {
    font-size: 17px; padding: 12px 16px; border-radius: 12px;
    border: 2px solid var(--tile-border); background: #fff; color: var(--ink);
    font-family: var(--font-body);
  }
  .memory-recall-input.correct { border-color: var(--sage); background: var(--sage-bg); }
  .memory-recall-input.wrong { border-color: var(--amber); background: var(--amber-bg); }
  .memory-actions { display: flex; justify-content: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .memory-reveal-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }

  .cardmem-grid { display: grid; gap: 8px; margin: 0 auto 20px; max-width: 460px; }
  .cardmem-card {
    aspect-ratio: 1; border-radius: 12px; border: 2px solid var(--tile-border);
    background: var(--sage); box-shadow: 0 3px 0 var(--sage-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; cursor: pointer; padding: 0;
    transition: transform 0.1s ease;
  }
  .cardmem-card:active { transform: scale(0.94); }
  .cardmem-card.revealed { background: var(--tile); box-shadow: 0 3px 0 var(--tile-shadow); cursor: default; }
  .cardmem-card.matched { background: var(--sage-bg); border-color: var(--sage); box-shadow: none; cursor: default; opacity: 0.8; }
  .cardmem-stats { display: flex; justify-content: center; gap: 16px; margin-bottom: 16px; font-size: 14px; color: var(--ink-soft); }
  .cardmem-stats b { color: var(--ink); font-family: var(--font-display); }

  .mahjong-grid { display: grid; gap: 6px; margin: 0 auto 20px; max-width: 560px; }
  .mahjong-tile {
    aspect-ratio: 1; border-radius: 8px; border: 2px solid var(--tile-border);
    background: var(--tile); box-shadow: 0 3px 0 var(--tile-shadow);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; cursor: pointer; padding: 0; position: relative;
    transition: transform 0.1s ease;
  }
  .mahjong-tile:active { transform: scale(0.94); }
  .mahjong-tile.blocked { opacity: 0.4; cursor: not-allowed; filter: grayscale(0.4); }
  .mahjong-tile.selected { border-color: var(--sage); box-shadow: 0 0 0 3px var(--sage-bg); }
  .mahjong-banner {
    text-align: center; background: var(--amber-bg); color: var(--amber);
    border-radius: 12px; padding: 10px 16px; margin-bottom: 16px; font-weight: 600; font-size: 14px;
  }

  .simon-grid { display: grid; gap: 12px; margin: 0 auto 22px; max-width: 360px; }
  .simon-pad {
    aspect-ratio: 1; border-radius: 18px; border: 4px solid transparent; cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.18);
    opacity: 0.32; filter: saturate(0.6) brightness(0.85);
  }
  .simon-pad:active { transform: scale(0.95); }
  .simon-pad.lit {
    opacity: 1; filter: saturate(1.3) brightness(1.25);
    border-color: #fff;
    box-shadow: 0 0 0 3px #fff, 0 0 28px 8px rgba(255,255,255,0.9), 0 4px 0 rgba(0,0,0,0.18);
    transform: scale(1.08);
  }
  .simon-pad.disabled { cursor: default; }
  .simon-status { text-align: center; font-family: var(--font-display); font-weight: 600; font-size: 17px; color: var(--ink); margin-bottom: 16px; min-height: 24px; }

  .player-row { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; color: var(--ink-soft); margin-bottom: 12px; }
  .link-btn { background: none; border: none; color: var(--sage-dark); font-weight: 600; cursor: pointer; font-size: 13px; text-decoration: underline; padding: 0; font-family: var(--font-body); }

  .stat-grid { display: flex; flex-wrap: wrap; gap: 10px; margin: 4px 0 16px; }
  .stat-box { flex: 1; min-width: 128px; background: #fff; border: 1.5px solid var(--tile-border); border-radius: 12px; padding: 10px 14px; text-align: center; }
  .stat-box .num { font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--sage-dark); }
  .stat-box .lbl { font-size: 12px; color: var(--ink-soft); }
  .word-chip.missed { background: #fff; border-color: var(--tile-border); color: var(--ink-soft); text-decoration: line-through; opacity: 0.75; }
  .resolution-title { font-family: var(--font-display); font-weight: 600; font-size: 16px; color: var(--ink); margin: 0 0 4px; }
  .resolution-sub { font-size: 13px; color: var(--ink-soft); margin: 0 0 12px; }

  @media (max-width: 380px) {
    .tile { width: 52px; height: 52px; font-size: 24px; }
    h1 { font-size: 26px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="eyebrow">🎲 Wortspiel</div>
    <h1>Buchstaben, Wörter, Ruhe.</h1>
    <p class="subtitle">Bilde so viele Wörter wie möglich aus den Buchstaben. Kein Zeitdruck, so lange du möchtest.</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-play">▶️ Spielen</button>
    <button class="tab-btn" id="tab-board">🏆 Bestenliste</button>
    <button class="tab-btn" id="tab-memory">🧠 Gedächtnis</button>
    <button class="tab-btn" id="tab-cardmemory">🃏 Karten-Memory</button>
    <button class="tab-btn" id="tab-mahjong">🀄 Mahjong</button>
    <button class="tab-btn" id="tab-simon">🎯 Simon</button>
  </div>

  <div id="play-view">
    <div class="player-row" id="player-row">
      <span id="player-name-label"></span>
      <button type="button" class="link-btn" id="change-nickname-btn">Spitzname ändern</button>
    </div>

    <div class="tiles" id="tiles"></div>

    <div class="controls-row">
      <button class="icon-btn" id="speak-btn" title="Buchstaben vorlesen">🔊</button>
      <button class="icon-btn" id="new-round-btn" title="Neue Runde">🔄</button>
      <button class="icon-btn" id="new-challenge-btn" title="Neue Challenge mit neuen Buchstaben starten" style="display:none;">🆕</button>
      <div class="timer-badge" id="timer-badge" style="display:none;"></div>
    </div>

    <form class="entry-form" id="entry-form">
      <input id="word-input" type="text" placeholder="Wort eingeben …" autocomplete="off">
      <button type="submit" id="add-btn">Hinzufügen</button>
    </form>

    <div id="message"></div>

    <div class="shelf">
      <div class="shelf-head">
        <span class="shelf-title">Deine Wörter (<span id="word-count">0</span>)</span>
        <span class="shelf-score"><span id="total-score">0</span> Punkte</span>
      </div>
      <p class="shelf-empty" id="shelf-empty">Noch keine Wörter — hier sammelt sich alles, was du findest.</p>
      <div class="shelf-words" id="shelf-words"></div>
    </div>

    <div class="shelf" id="challenge-result" style="display:none;"></div>

    <p class="best-note" id="best-note" style="display:none;"></p>

    <div class="round-actions">
      <button class="btn-primary" id="round-toggle-btn">Runde beenden</button>
    </div>

    <div class="settings">
      <p class="settings-title">Einstellungen</p>
      <div class="settings-row" id="mode-row">
        <button class="pill-btn" data-mode="free">🔀 Frei üben</button>
        <button class="pill-btn" data-mode="challenge">🏆 Challenge</button>
      </div>
      <div class="settings-row" id="letter-count-row">
        <button class="pill-btn" data-count="4">4 Buchstaben</button>
        <button class="pill-btn" data-count="5">5 Buchstaben</button>
        <button class="pill-btn" data-count="6">6 Buchstaben</button>
        <button class="pill-btn" data-count="8">8 Buchstaben</button>
      </div>
      <div class="settings-center">
        <button class="pill-btn" id="timer-toggle-btn">Timer aus</button>
      </div>
    </div>
  </div>

  <div id="board-view" class="hidden">
    <div id="board-content"></div>
  </div>

  <div id="memory-view" class="hidden">
    <div class="player-row" id="memory-player-row"></div>
    <div id="memory-content"></div>
  </div>

  <div id="cardmemory-view" class="hidden">
    <div class="player-row" id="cardmemory-player-row"></div>
    <div id="cardmemory-content"></div>
  </div>

  <div id="mahjong-view" class="hidden">
    <div class="player-row" id="mahjong-player-row"></div>
    <div id="mahjong-content"></div>
  </div>

  <div id="simon-view" class="hidden">
    <div class="player-row" id="simon-player-row"></div>
    <div id="simon-content"></div>
  </div>

</div>

<script src="vendor-supabase.js"></script>

/* ---------------- Letter generation ---------------- */
const LETTER_WEIGHTS = { E:16,N:10,S:7,I:7,R:7,T:6,A:6,D:5,H:5,U:5,L:4,C:3,G:3,M:4,O:3,B:2,W:2,F:2,K:2,Z:2,P:1,V:1,J:1,Y:1,X:1,Q:1 };
const VOWELS = new Set(['A','E','I','O','U']);

function buildBag() {
  const bag = [];
  Object.entries(LETTER_WEIGHTS).forEach(([l, w]) => { for (let i = 0; i < w; i++) bag.push(l); });
  return bag;
}

function generateLetters(count) {
  const minVowels = count <= 4 ? 1 : 2;
  let lastDraw = [];
  for (let attempt = 0; attempt < 100; attempt++) {
    const pool = buildBag();
    const draw = [];
    for (let i = 0; i < count; i++) {
      const idx = Math.floor(Math.random() * pool.length);
      draw.push(pool[idx]);
      pool.splice(idx, 1);
    }
    lastDraw = draw;
    const vowelCount = draw.filter(l => VOWELS.has(l)).length;
    if (vowelCount >= minVowels && vowelCount < count) return draw;
  }
  return lastDraw;
}

function countLetters(arr) {
  const m = {};
  arr.forEach(l => { m[l] = (m[l] || 0) + 1; });
  return m;
}

function canFormWord(word, letterCounts) {
  const wc = countLetters(word.toUpperCase().split(''));
  for (const l in wc) {
    if ((letterCounts[l] || 0) < wc[l]) return false;
  }
  return true;
}

function wordScore(word, usesAll) {
  let s = word.length * word.length;
  if (usesAll) s += 15;
  return s;
}

function computeMaxPossible(lettersArr) {
  const counts = countLetters(lettersArr);
  const words = [];
  let maxScore = 0;
  WORDS.forEach(w => {
    if (w.length >= 2 && w.length <= lettersArr.length && canFormWord(w, counts)) {
      words.push(w);
      maxScore += wordScore(w, w.length === lettersArr.length);
    }
  });
  words.sort((a, b) => b.length - a.length || a.localeCompare(b, 'de'));
  return { words, maxScore };
}

function loadPlayer() {
  try {
    const raw = localStorage.getItem(PLAYER_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* ignore */ }
  return null;
}

function savePlayer(p) {
  try { localStorage.setItem(PLAYER_KEY, JSON.stringify(p)); } catch (e) { /* ignore */ }
}

async function ensurePlayer() {
  if (player && player.id && player.nickname) return player;
  if (!sb) return null;
  const name = (window.prompt('Wie ist dein Spitzname für die Bestenliste?') || '').trim().slice(0, 24);
  if (!name) return null;
  const id = crypto.randomUUID();
  const { error } = await sb.from('wortspiel_players').insert({ id, nickname: name });
  if (error) { console.error(error); return null; }
  player = { id, nickname: name };
  savePlayer(player);
  renderPlayerRow();
  return player;
}

async function renameNickname() {
  const p = await ensurePlayer();
  if (!p) return;
  const name = (window.prompt('Neuer Spitzname:', p.nickname) || '').trim().slice(0, 24);
  if (!name || name === p.nickname) return;
  const { error } = await sb.from('wortspiel_players').update({ nickname: name }).eq('id', p.id);
  if (error) { console.error(error); return; }
  player.nickname = name;
  savePlayer(player);
  renderPlayerRow();
}

/* ---------------- Rendering ---------------- */
function renderTiles() {
  $tiles.innerHTML = '';
  letters.forEach((l, i) => {
    const div = document.createElement('div');
    div.className = 'tile';
    div.style.animationDelay = (i * 0.06) + 's';
    div.textContent = l;
    $tiles.appendChild(div);
  });
}

function setMessage(text, tone) {
  $message.textContent = text;
  $message.className = tone === 'amber' ? 'tone-amber' : tone === 'sage' ? 'tone-sage' : '';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderPlayerRow() {
  $playerRow.style.display = settings.mode === 'challenge' ? 'flex' : 'none';
  if (player && player.nickname) {
    $playerNameLabel.textContent = '👤 ' + player.nickname;
    $changeNicknameBtn.textContent = 'Spitzname ändern';
  } else {
    $playerNameLabel.textContent = 'Noch kein Spitzname gewählt';
    $changeNicknameBtn.textContent = 'Spitzname wählen';
  }
}

function renderShelf() {
  $wordCount.textContent = foundWords.length;
  const total = foundWords.reduce((s, w) => s + w.points, 0);
  $totalScore.textContent = total;
  $shelfEmpty.style.display = foundWords.length === 0 ? 'block' : 'none';
  $shelfWords.innerHTML = '';
  foundWords.forEach(w => {
    const chip = document.createElement('div');
    chip.className = 'word-chip' + (w.allLetters ? ' bonus' : '');
    chip.innerHTML = (w.allLetters ? '<span class="star">★</span> ' : '') + w.word + ' <span class="pts">+' + w.points + '</span>';
    $shelfWords.appendChild(chip);
  });
}

function renderBestNote() {
  if (settings.mode !== 'free') { $bestNote.style.display = 'none'; return; }
  const best = leaderboard
    .filter(e => e.letterCount === settings.letterCount)
    .reduce((max, e) => Math.max(max, e.score), 0);
  if (best > 0) {
    $bestNote.style.display = 'block';
    $bestNote.textContent = 'Bestwert bei ' + settings.letterCount + ' Buchstaben: ' + best + ' Punkte';
  } else {
    $bestNote.style.display = 'none';
  }
}

function hideChallengeResult() {
  $challengeResult.style.display = 'none';
  $challengeResult.innerHTML = '';
}

function renderChallengeResult(stats) {
  const { challenge, foundSet, myWordCount, plays, saved } = stats;
  const pctFound = challenge.max_word_count ? Math.round(myWordCount / challenge.max_word_count * 100) : 0;
  const total = plays.length;
  const rankIdx = player ? plays.findIndex(p => p.player_id === player.id) : -1;
  const rank = rankIdx >= 0 ? rankIdx + 1 : null;
  const better = rankIdx >= 0 ? plays.filter(p => p.score < plays[rankIdx].score).length : 0;
  const pctBetter = total > 1 ? Math.round(better / (total - 1) * 100) : (total === 1 ? 100 : null);

  const missed = challenge.possible_words.filter(w => !foundSet.has(w));
  const missedChips = missed.map(w => '<div class="word-chip missed">' + escapeHtml(w) + '</div>').join('');

  let statBoxes = '<div class="stat-box"><div class="num">' + pctFound + '%</div><div class="lbl">der möglichen Wörter gefunden</div></div>';
  if (saved && total > 0) {
    statBoxes += '<div class="stat-box"><div class="num">' + (rank ? '#' + rank : '–') + '</div><div class="lbl">Platz von ' + total + ' Spieler' + (total === 1 ? '' : 'n') + '</div></div>';
    if (pctBetter !== null) {
      statBoxes += '<div class="stat-box"><div class="num">' + pctBetter + '%</div><div class="lbl">der Mitspieler geschlagen</div></div>';
    }
  }

  $challengeResult.innerHTML =
    '<p class="resolution-title">🔍 Auflösung der aktuellen Challenge</p>' +
    '<p class="resolution-sub">Buchstaben: ' + escapeHtml(challenge.letters) + ' · maximal ' + challenge.max_word_count + ' Wörter (' + challenge.max_score + ' Punkte) waren möglich.</p>' +
    (!saved ? '<p class="resolution-sub">Ohne Spitzname wird dein Ergebnis nicht in der Bestenliste gespeichert.</p>' : '') +
    '<div class="stat-grid">' + statBoxes + '</div>' +
    (missed.length > 0
      ? '<p class="shelf-title" style="display:block; margin-bottom:8px;">Verpasste Wörter (' + missed.length + ')</p><div class="shelf-words">' + missedChips + '</div>'
      : '<p class="shelf-empty">Du hast alle möglichen Wörter gefunden! 🎉</p>') +
    '<div class="memory-actions" style="margin-top:16px;">' +
      '<button class="pill-btn" id="challenge-result-new-btn">🆕 Neue Buchstaben starten</button>' +
    '</div>';
  $challengeResult.style.display = 'block';
  document.getElementById('challenge-result-new-btn').addEventListener('click', startNewChallenge);
}

function renderRoundControls() {
  $wordInput.disabled = !roundActive;

  $wordInput.placeholder = roundActive ? 'Wort eingeben …' : 'Runde beendet';

    $roundToggleBtn.textContent = 'Runde beenden';
  } else {
    $roundToggleBtn.textContent = settings.mode === 'challenge' ? 'Nochmal versuchen (gleiche Buchstaben)' : 'Neue Runde starten';

}

function renderSettings() {
  Array.from($letterCountRow.children).forEach(btn => {
    const n = parseInt(btn.dataset.count, 10);
    btn.classList.toggle('selected', n === settings.letterCount);
  });
  Array.from($modeRow.children).forEach(btn => {

function renderTimerBadge() {
  if (settings.timerEnabled && roundActive) {
    $timerBadge.style.display = 'flex';
    const m = Math.floor(timeLeft / 60);
    const s = String(timeLeft % 60).padStart(2, '0');
    $timerBadge.textContent = m + ':' + s;
  } else {
    $timerBadge.style.display = 'none';
  }

let boardLetterCount = null;
const BOARD_LETTER_COUNTS = [4, 5, 6, 8];

async function renderBoard() {
  if (boardLetterCount === null) boardLetterCount = settings.letterCount;

  const tabs = BOARD_LETTER_COUNTS.map(n =>
    '<button class="pill-btn' + (n === boardLetterCount ? ' selected' : '') + '" data-board-count="' + n + '">' + n + ' Buchstaben</button>'
  ).join('');

  $boardContent.innerHTML =
    '<div class="board-tabs" id="board-count-tabs">' + tabs + '</div>' +
    '<p class="board-section-title">🏆 Aktuelle Challenge</p>' +
    '<div id="challenge-board"><p class="board-empty">Lädt …</p></div>' +
    '<p class="board-section-title" style="margin-top:28px;">Deine besten Runden (frei geübt, auf diesem Gerät)</p>' +
    '<div id="local-board"></div>';

  Array.from(document.getElementById('board-count-tabs').children).forEach(btn => {
    btn.addEventListener('click', () => {
      boardLetterCount = parseInt(btn.dataset.boardCount, 10);
      renderBoard();
    });
  });

  renderLocalBoard();
  await renderChallengeBoard();
}

function renderLocalBoard() {
  const $local = document.getElementById('local-board');
  if (!$local) return;
  const entries = leaderboard.filter(e => e.letterCount === boardLetterCount);
  if (entries.length === 0) {
    $local.innerHTML = '<p class="board-empty">Noch keine freien Runden mit ' + boardLetterCount + ' Buchstaben gespeichert.</p>';
    return;
  }
  const rows = entries.map((e, i) => {
    const date = new Date(e.date);
    const dateStr = date.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }) +
      ', ' + date.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    return '<div class="board-row">' +
      '<div class="board-rank">' + (i + 1) + '</div>' +
      '<div class="board-main">' +
        '<div class="board-score">' + e.score + ' Punkte · ' + e.wordCount + ' Wörter</div>' +
        '<div class="board-meta">' + dateStr + ' · ' + e.letterCount + ' Buchstaben</div>' +
      '</div>' +
    '</div>';
  }).join('');
  $local.innerHTML = '<div class="board-list">' + rows + '</div>';
}

async function renderChallengeBoard() {
  const requestedCount = boardLetterCount;
  const $cb = document.getElementById('challenge-board');
  if (!sb) {
    $cb.innerHTML = '<p class="board-empty">Bestenliste aktuell nicht erreichbar (keine Internetverbindung?).</p>';
    return;
  }
  const { data: challenge, error: challengeErr } = await sb.from('wortspiel_challenges')
    .select('*').eq('letter_count', requestedCount).order('created_at', { ascending: false }).limit(1).maybeSingle();

  if (boardLetterCount !== requestedCount) return; // Nutzer hat inzwischen die Länge gewechselt
  const $target = document.getElementById('challenge-board');
  if (!$target) return;

  if (challengeErr) {
    $target.innerHTML = '<p class="board-empty">Rangliste konnte nicht geladen werden.</p>';
    return;
  }
  if (!challenge) {
    $target.innerHTML = '<p class="board-empty">Es läuft noch keine Challenge mit ' + requestedCount + ' Buchstaben. Spiel als Erste:r los!</p>';
    return;
  }

  const { data: playsData } = await sb.from('wortspiel_plays')
    .select('*').eq('challenge_id', challenge.id).order('score', { ascending: false });
  const plays = playsData || [];

  const header = '<div class="stat-grid">' +
    '<div class="stat-box"><div class="num">' + escapeHtml(challenge.letters) + '</div><div class="lbl">Aktuelle Buchstaben</div></div>' +
    '<div class="stat-box"><div class="num">' + challenge.max_word_count + '</div><div class="lbl">Maximal mögliche Wörter</div></div>' +
    '<div class="stat-box"><div class="num">' + plays.length + '</div><div class="lbl">Mitspieler bisher</div></div>' +
  '</div>';

  if (plays.length === 0) {
    $target.innerHTML = header + '<p class="board-empty">Noch keine Ergebnisse. Spiel als Erste:r los!</p>';
    return;
  }

  const rows = plays.map((e, i) => {
    const own = player && e.player_id === player.id;
    const pct = challenge.max_word_count ? Math.round(e.word_count / challenge.max_word_count * 100) : 0;
    return '<div class="board-row' + (own ? ' own' : '') + '">' +
      '<div class="board-rank">' + (i + 1) + '</div>' +
      '<div class="board-main">' +
        '<div class="board-score">' + escapeHtml(e.nickname) + ' · ' + e.score + ' Punkte</div>' +
        '<div class="board-meta">' + e.word_count + ' Wörter · ' + pct + '% der Möglichkeiten</div>' +
      '</div>' +
    '</div>';
  }).join('');
  $target.innerHTML = header + '<div class="board-list">' + rows + '</div>';
}

/* ---------------- Game logic ---------------- */
async function getCurrentChallenge(letterCount) {
  if (!sb) return null;
  const { data: existing, error: selectErr } = await sb.from('wortspiel_challenges')
    .select('*').eq('letter_count', letterCount).order('created_at', { ascending: false }).limit(1).maybeSingle();
  if (selectErr) { console.error(selectErr); return null; }
  if (existing) return existing;
  return createChallenge(letterCount);
}

async function createChallenge(letterCount) {
  if (!sb) return null;
  const candidateLetters = generateLetters(letterCount);
  const { words, maxScore } = computeMaxPossible(candidateLetters);
  const row = {
    letter_count: letterCount,
    letters: candidateLetters.join(''),
    possible_words: words,
    max_word_count: words.length,
    max_score: maxScore,
  };
  const { data: inserted, error: insertErr } = await sb.from('wortspiel_challenges')
    .insert(row).select().maybeSingle();
  if (insertErr) { console.error(insertErr); return null; }
  return inserted;
}

async function startNewChallenge() {
  if (!sb || settings.mode !== 'challenge') return;
  const ok = window.confirm('Neue Challenge mit neuen Buchstaben starten? Alle, die ab jetzt mitspielen, spielen diese neue Runde statt der bisherigen.');
  if (!ok) return;
  clearInterval(timerInterval);
  hideChallengeResult();
  roundActive = false;
  renderRoundControls();
  setMessage('Neue Challenge wird erstellt …', 'neutral');

  const created = await createChallenge(settings.letterCount);
  if (!created) {
    setMessage('Neue Challenge konnte nicht erstellt werden. Prüfe deine Internetverbindung.', 'amber');
    return;
  }
  currentChallenge = created;
  letters = currentChallenge.letters.split('');
  letterCounts = countLetters(letters);
  foundWords = [];
  roundActive = true;
  timeLeft = settings.letterCount <= 4 ? 60 : settings.letterCount === 5 ? 90 : settings.letterCount === 6 ? 120 : 150;
  setMessage('Neue Challenge – wie viele der möglichen Wörter findest du?', 'neutral');
  renderTiles();
  renderShelf();
  renderBestNote();
  renderRoundControls();
  renderTimerBadge();
  $wordInput.value = '';
  setTimeout(() => $wordInput.focus(), 50);

  if (settings.timerEnabled) {
    timerInterval = setInterval(() => {
      timeLeft -= 1;
      if (timeLeft <= 0) {
        timeLeft = 0;
        renderTimerBadge();
        clearInterval(timerInterval);
        endRound();
        return;
      }
      renderTimerBadge();
    }, 1000);
  }
}

async function startRound() {
  clearInterval(timerInterval);
  hideChallengeResult();
  roundActive = false;
  renderRoundControls();

  if (settings.mode === 'challenge') {
    setMessage('Lädt die aktuelle Challenge …', 'neutral');
    currentChallenge = await getCurrentChallenge(settings.letterCount);
    if (!currentChallenge) {
      setMessage('Challenge konnte nicht geladen werden. Prüfe deine Internetverbindung.', 'amber');
      return;
    }
    letters = currentChallenge.letters.split('');
  } else {
    currentChallenge = null;
    letters = generateLetters(settings.letterCount);
  }

  letterCounts = countLetters(letters);
  foundWords = [];
  roundActive = true;
  timeLeft = settings.letterCount <= 4 ? 60 : settings.letterCount === 5 ? 90 : settings.letterCount === 6 ? 120 : 150;
  setMessage(settings.mode === 'challenge' ? 'Aktuelle Challenge – wie viele der möglichen Wörter findest du?' : 'Los geht’s — wie viele Wörter findest du?', 'neutral');
  renderTiles();
  renderShelf();
  renderBestNote();
  renderRoundControls();
  renderTimerBadge();
  $wordInput.value = '';
  setTimeout(() => $wordInput.focus(), 50);

  if (settings.timerEnabled) {
    timerInterval = setInterval(() => {
      timeLeft -= 1;
      if (timeLeft <= 0) {
        timeLeft = 0;
        renderTimerBadge();
        clearInterval(timerInterval);
        endRound();
        return;
      }
      renderTimerBadge();
    }, 1000);
  }
}

async function finishChallengeRound(total) {
  const challenge = currentChallenge;
  const p = await ensurePlayer();
  let plays = [];
  let myRecord = null;
  if (p) {
    const { data: existing } = await sb.from('wortspiel_plays')
      .select('*').eq('challenge_id', challenge.id).eq('player_id', p.id).maybeSingle();
    if (!existing || total > existing.score) {
      const row = {
        challenge_id: challenge.id, player_id: p.id, nickname: p.nickname,
        score: total, word_count: foundWords.length, words: foundWords.map(w => w.word),
        updated_at: new Date().toISOString(),
      };
      const { data: upserted, error } = await sb.from('wortspiel_plays')
        .upsert(row, { onConflict: 'challenge_id,player_id' }).select().maybeSingle();
      if (error) console.error(error);
      myRecord = upserted || row;
    } else {
      myRecord = existing;
    }
    const { data } = await sb.from('wortspiel_plays')
      .select('*').eq('challenge_id', challenge.id).order('score', { ascending: false });
    plays = data || [];
  }

  const foundSet = new Set(myRecord ? myRecord.words : foundWords.map(w => w.word));
  const myWordCount = myRecord ? myRecord.word_count : foundWords.length;
  renderChallengeResult({ challenge, foundSet, myWordCount, plays, saved: !!p });
}

async function endRound() {
  clearInterval(timerInterval);
  roundActive = false;
  const total = foundWords.reduce((s, w) => s + w.points, 0);

  if (settings.mode === 'challenge' && currentChallenge) {
    setMessage('Runde beendet: ' + foundWords.length + ' Wörter, ' + total + ' Punkte. Werte aus …', 'sage');
    renderRoundControls();
    renderTimerBadge();
    await finishChallengeRound(total);
  } else {
    const entry = {
      date: new Date().toISOString(),
      letterCount: settings.letterCount,
      score: total,
      wordCount: foundWords.length,
      words: foundWords.map(w => w.word),
    };
    leaderboard = [...leaderboard, entry].sort((a, b) => b.score - a.score).slice(0, 50);
    saveState();
    setMessage('Runde beendet: ' + foundWords.length + ' Wörter, ' + total + ' Punkte.', 'sage');
  }

  renderRoundControls();
  renderTimerBadge();
  renderBestNote();
}

function submitWord(evt) {
  evt.preventDefault();
  const raw = $wordInput.value.trim();
  if (!raw) return;
  const word = raw.toLowerCase();
  $wordInput.value = '';
  if (!roundActive) return;

  if (word.length < 2) {
    setMessage('Das Wort braucht mindestens 2 Buchstaben.', 'amber');
    return;
  }
  if (foundWords.some(w => w.word === word)) {
    setMessage('„' + word + '“ hast du schon gefunden.', 'amber');
    return;
  }
  if (!canFormWord(word, letterCounts)) {
    setMessage('Diese Buchstaben stehen dir nicht zur Verfügung.', 'amber');
    return;
  }
  if (!WORDS.has(word)) {
    setMessage('„' + word + '“ steht nicht im Wörterbuch.', 'amber');
    return;
  }
  const allLetters = word.length === letters.length;
  const points = wordScore(word, allLetters);
  foundWords.push({ word, points, allLetters });
  setMessage(allLetters ? 'Alle Buchstaben genutzt! +' + points + ' Punkte' : 'Gefunden! +' + points + ' Punkte', 'sage');
  renderShelf();
  setTimeout(() => $wordInput.focus(), 10);
}

function speakLetters() {
  if (!('speechSynthesis' in window)) return;
  const utter = new SpeechSynthesisUtterance(letters.join(', '));
  utter.lang = 'de-DE';
  utter.rate = 0.85;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
}

/* ---------------- Memory game ---------------- */
// Item generation is pluggable by type (word today; number/color can be added
// later as further difficulty levels without touching the schema or scoring).
// The word pools are hand-curated, everyday, concrete nouns rather than the
// full word-game dictionary, which is optimized for letter-forming and is
// full of place names, surnames and abbreviations that are a poor fit here.
const MEMORY_WORD_POOLS = {
  easy: [
    'Baum', 'Blume', 'Wald', 'Berg', 'Fluss', 'Wolke', 'Regen', 'Schnee', 'Wind', 'Blatt',

    'Tisch', 'Stuhl', 'Bett', 'Lampe', 'Fenster', 'Teppich', 'Spiegel', 'Schrank', 'Regal', 'Kissen',
    'Decke', 'Vase', 'Besen', 'Eimer', 'Kerze', 'Topf', 'Teller', 'Tasse', 'Gabel', 'Löffel', 'Messer', 'Pfanne',
    'Hose', 'Hemd', 'Jacke', 'Mantel', 'Schuh', 'Socke', 'Mütze', 'Schal', 'Gürtel', 'Kleid', 'Rock', 'Anzug',
    'Kopf', 'Hand', 'Auge', 'Ohr', 'Nase', 'Mund', 'Haar', 'Finger', 'Rücken', 'Bauch', 'Herz', 'Schulter', 'Knie',
    'Auto', 'Zug', 'Bus', 'Fahrrad', 'Boot', 'Schiff', 'Flugzeug', 'Rakete', 'Straße', 'Brücke', 'Bahnhof',
    'Buch', 'Stift', 'Papier', 'Brief', 'Schlüssel', 'Ball', 'Ring', 'Münze', 'Tasche', 'Koffer',
    'Schirm', 'Brille', 'Telefon', 'Radio', 'Gitarre', 'Trommel', 'Puppe', 'Drachen', 'Ballon', 'Kamera', 'Zeitung',
    'Mutter', 'Vater', 'Bruder', 'Schwester', 'Freund', 'Lehrer', 'Koch', 'Bäcker', 'Bauer',
    'Blitz', 'Donner', 'Nebel', 'Frost', 'Gewitter', 'Regenbogen',
    'Garten', 'Park', 'Schule', 'Markt', 'Turm', 'Zaun', 'Treppe', 'Keller', 'Dach', 'Kamin',
  ],
};
const MEMORY_LEVELS = {
  easy: { types: ['word'], wordPool: 'easy' },
};
const memoryWordPoolLevel = 'easy';

// Persistent per-player difficulty level, separate from MEMORY_LEVELS above
// (which picks the word pool). This one grows with lifetime XP and drives
// how many items must be memorized, whether a memorize-timer applies, and
// how many points each correctly recalled item is worth.
const MEMORY_XP_STEP = 25; // triangular curve: level L needs 25*L*(L-1) total XP
function memoryXpForLevel(level) { return MEMORY_XP_STEP * level * (level - 1); }
function memoryLevelFromXp(xp) {
  let level = 1;
  while (memoryXpForLevel(level + 1) <= xp) level++;
  return level;
}
function memoryItemCountForLevel(level) { return Math.min(6 + Math.floor((level - 1) / 2), 10); }
function memoryPointsPerItem(itemCount) { return 10 + (itemCount - 6) * 4; }
function memoryTimeLimitSeconds(itemCount) {
  const limits = { 8: 25, 9: 20, 10: 15 };
  return limits[itemCount] || null;
}

function generateMemoryItems(count) {
  const level = MEMORY_LEVELS[memoryWordPoolLevel];
  const pool = MEMORY_WORD_POOLS[level.wordPool];
  const items = [];
  const usedIdx = new Set();
  while (items.length < count && usedIdx.size < pool.length) {
    const idx = Math.floor(Math.random() * pool.length);
    if (usedIdx.has(idx)) continue;
    usedIdx.add(idx);
    items.push(pool[idx]);
  }
  return items;
}

function generateDistractor() {
  const position = 1 + Math.floor(Math.random() * 26);
  const answer = String.fromCharCode(64 + position); // 'A'..'Z'
  return { position, answer };
}

let memoryPhase = 'idle'; // idle | loading | memorize | distractor | recall | result
let memoryChallenge = null;
let memoryDistractorInput = '';
let memoryDistractorResult = null; // null | true | false
let memoryRecallValues = [];
let memoryResultData = null;
let playerMemoryXp = 0;
let memoryTimerInterval = null;
let memoryTimeLeft = null;

async function refreshPlayerMemoryXp() {
  if (!sb || !player || !player.id) { playerMemoryXp = 0; return; }
  const { data, error } = await sb.from('wortspiel_players').select('memory_xp').eq('id', player.id).maybeSingle();
  if (error) { console.error(error); return; }
  playerMemoryXp = (data && data.memory_xp) || 0;
}

async function getCurrentMemoryChallenge(itemCount) {
  if (!sb) return null;
  const { data: existing, error: selErr } = await sb.from('wortspiel_memory_challenges')
    .select('*').eq('item_count', itemCount).order('created_at', { ascending: false }).limit(1).maybeSingle();
  if (selErr) { console.error(selErr); return null; }
  if (existing) return existing;
  return createMemoryChallenge(itemCount);
}

async function createMemoryChallenge(itemCount) {
  if (!sb) return null;
  const items = generateMemoryItems(itemCount);
  const { position, answer } = generateDistractor();
  const row = { items, distractor_position: position, distractor_answer: answer, item_count: itemCount };
  const { data, error } = await sb.from('wortspiel_memory_challenges').insert(row).select().maybeSingle();
  if (error) { console.error(error); return null; }
  return data;
}

function stopMemorizeTimer() {
  if (memoryTimerInterval) { clearInterval(memoryTimerInterval); memoryTimerInterval = null; }
}

async function startMemoryExercise() {
  memoryDistractorInput = '';
  memoryDistractorResult = null;
  memoryRecallValues = [];
  memoryResultData = null;
  stopMemorizeTimer();
  memoryPhase = 'loading';
  renderMemoryView();
  await refreshPlayerMemoryXp();
  const itemCount = memoryItemCountForLevel(memoryLevelFromXp(playerMemoryXp));
  memoryChallenge = await getCurrentMemoryChallenge(itemCount);
  if (!memoryChallenge) {
    memoryPhase = 'idle';
    renderMemoryView('Übung konnte nicht geladen werden. Prüfe deine Internetverbindung.');
    return;
  }
  memoryPhase = 'memorize';
  renderMemoryView();
}

function retryMemoryExercise() {
  memoryDistractorInput = '';
  memoryDistractorResult = null;
  memoryRecallValues = [];
  memoryResultData = null;
  stopMemorizeTimer();
  memoryPhase = 'memorize';
  renderMemoryView();
}

async function startNewMemoryExercise() {
  if (!sb) return;
  const ok = window.confirm('Neue Merk-Übung mit neuen Begriffen starten? Alle, die ab jetzt mitspielen, bekommen diese neue Runde statt der bisherigen.');
  if (!ok) return;
  stopMemorizeTimer();
  memoryPhase = 'loading';
  renderMemoryView();
  await refreshPlayerMemoryXp();
  const itemCount = memoryItemCountForLevel(memoryLevelFromXp(playerMemoryXp));
  const created = await createMemoryChallenge(itemCount);
  if (!created) {
    memoryPhase = 'idle';
    renderMemoryView('Neue Übung konnte nicht erstellt werden. Prüfe deine Internetverbindung.');
    return;
  }
  memoryChallenge = created;
  memoryDistractorInput = '';
  memoryDistractorResult = null;
  memoryRecallValues = [];
  memoryResultData = null;
  memoryPhase = 'memorize';
  renderMemoryView();
}

function confirmMemorized() {
  stopMemorizeTimer();
  memoryPhase = 'distractor';
  renderMemoryView();
}

function startMemorizeTimer(seconds) {
  stopMemorizeTimer();
  memoryTimeLeft = seconds;
  memoryTimerInterval = setInterval(() => {
    memoryTimeLeft--;
    if (memoryTimeLeft <= 0) {
      confirmMemorized();
    } else {
      const $badge = document.getElementById('memory-timer-badge');
      if ($badge) $badge.textContent = '⏱ ' + memoryTimeLeft + 's';
    }
  }, 1000);
}

function submitDistractorAnswer() {
  const $input = document.getElementById('memory-distractor-input');
  const val = ($input ? $input.value : memoryDistractorInput).trim().toUpperCase();
  memoryDistractorInput = val;
  memoryDistractorResult = val === memoryChallenge.distractor_answer.toUpperCase();
  renderMemoryView();
}

function proceedToRecall() {
  memoryPhase = 'recall';
  renderMemoryView();
}

async function submitRecall() {
  const inputs = Array.from(document.querySelectorAll('.memory-recall-input'));
  const recalled = inputs.map(inp => inp.value.trim());
  memoryRecallValues = recalled;

  const targetPool = memoryChallenge.items.map(w => w.toLowerCase());
  const itemMatched = new Array(targetPool.length).fill(false);
  recalled.forEach(v => {
    const lv = v.toLowerCase();
    if (!lv) return;
    const targetIdx = targetPool.findIndex((t, i) => t === lv && !itemMatched[i]);
    if (targetIdx !== -1) itemMatched[targetIdx] = true;
  });
  const correctCount = itemMatched.filter(Boolean).length;
  const itemCount = memoryChallenge.items.length;
  const pointsPerItem = memoryPointsPerItem(itemCount);
  const perfectBonus = (correctCount === itemCount && memoryDistractorResult) ? 15 : 0;
  const roundPoints = correctCount * pointsPerItem + perfectBonus;

  memoryPhase = 'loading';
  renderMemoryView();

  const p = await ensurePlayer();
  let plays = [];
  let myRecord = null;
  let xpGained = 0;
  let overallBoard = [];
  if (p) {
    const { data: existing } = await sb.from('wortspiel_memory_plays')
      .select('*').eq('challenge_id', memoryChallenge.id).eq('player_id', p.id).maybeSingle();
    if (!existing || correctCount > existing.correct_count) {
      const row = {
        challenge_id: memoryChallenge.id, player_id: p.id, nickname: p.nickname,
        correct_count: correctCount, recalled_items: recalled,
        distractor_correct: !!memoryDistractorResult,
        points: roundPoints, player_level: memoryLevelFromXp(playerMemoryXp),
        updated_at: new Date().toISOString(),
      };
      const { data: upserted, error } = await sb.from('wortspiel_memory_plays')
        .upsert(row, { onConflict: 'challenge_id,player_id' }).select().maybeSingle();
      if (error) console.error(error);
      myRecord = upserted || row;
      xpGained = roundPoints - (existing ? existing.points : 0);
      if (xpGained > 0) {
        const newXp = playerMemoryXp + xpGained;
        const { error: xpErr } = await sb.from('wortspiel_players').update({ memory_xp: newXp }).eq('id', p.id);
        if (xpErr) console.error(xpErr); else playerMemoryXp = newXp;
      }
    } else {
      myRecord = existing;
    }
    const { data } = await sb.from('wortspiel_memory_plays')
      .select('*').eq('challenge_id', memoryChallenge.id).order('correct_count', { ascending: false });
    plays = data || [];
    const { data: boardData } = await sb.from('wortspiel_players')
      .select('id,nickname,memory_xp').gt('memory_xp', 0).order('memory_xp', { ascending: false }).limit(10);
    overallBoard = boardData || [];
  }

  memoryResultData = { correctCount, itemMatched, recalled, myRecord, plays, saved: !!p, roundPoints, xpGained, overallBoard };
  memoryPhase = 'result';
  renderMemoryView();
}

function renderMemoryPlayerRow() {
  const $row = document.getElementById('memory-player-row');
  if (!$row) return;
  if (player && player.nickname) {
    const lvl = memoryLevelFromXp(playerMemoryXp);
    const toNext = memoryXpForLevel(lvl + 1) - playerMemoryXp;
    $row.innerHTML = '👤 ' + escapeHtml(player.nickname) +
      ' <span class="pill-btn" style="cursor:default;padding:4px 12px;font-size:13px;" title="noch ' + toNext + ' XP bis Level ' + (lvl + 1) + '">🏅 Level ' + lvl + ' · ' + playerMemoryXp + ' XP</span>' +
      ' <button type="button" class="link-btn" id="memory-change-nickname-btn">Spitzname ändern</button>';
  } else {
    $row.innerHTML = 'Noch kein Spitzname gewählt <button type="button" class="link-btn" id="memory-change-nickname-btn">Spitzname wählen</button>';
  }
  document.getElementById('memory-change-nickname-btn').addEventListener('click', async () => {
    await renameNickname();
    await refreshPlayerMemoryXp();
    renderMemoryPlayerRow();
  });
}

function renderMemoryView(errorMessage) {
  if (!$memoryContent) return;
  renderMemoryPlayerRow();

  if (memoryPhase === 'loading') {
    $memoryContent.innerHTML = '<p class="board-empty">Lädt …</p>';
    return;
  }

  if (memoryPhase === 'idle') {
    const lvl = memoryLevelFromXp(playerMemoryXp);
    const itemCount = memoryItemCountForLevel(lvl);
    const limit = memoryTimeLimitSeconds(itemCount);
    $memoryContent.innerHTML =
      '<p class="memory-prompt"><span class="big">🧠 Gedächtnistraining</span><br>' +
      '<span class="sub">Merk dir ' + itemCount + ' Begriffe' + (limit ? ' in ' + limit + 's' : '') + ', löse eine kurze Zwischenaufgabe und gib sie danach aus dem Gedächtnis wieder ein.</span></p>' +
      (errorMessage ? '<p style="text-align:center; color:var(--amber);">' + escapeHtml(errorMessage) + '</p>' : '') +
      '<div class="memory-actions"><button class="btn-primary" id="memory-start-btn">Übung starten</button></div>';
    document.getElementById('memory-start-btn').addEventListener('click', startMemoryExercise);
    if (player && player.id) {
      refreshPlayerMemoryXp().then(() => { if (memoryPhase === 'idle') renderMemoryPlayerRow(); });
    }
    return;
  }

  if (!memoryChallenge) { $memoryContent.innerHTML = '<p class="board-empty">Keine aktive Übung.</p>'; return; }

  if (memoryPhase === 'memorize') {
    const limit = memoryTimeLimitSeconds(memoryChallenge.item_count || memoryChallenge.items.length);
    const cards = memoryChallenge.items.map(item => '<div class="memory-card">' + escapeHtml(item) + '</div>').join('');
    if (limit && memoryTimerInterval === null) memoryTimeLeft = limit;
    $memoryContent.innerHTML =
      '<p class="memory-prompt"><span class="big">Merk dir diese ' + memoryChallenge.items.length + ' Begriffe</span><br>' +
      '<span class="sub">' + (limit ? 'Die Zeit läuft – schau genau hin.' : 'Nimm dir so viel Zeit, wie du brauchst.') + '</span></p>' +
      (limit ? '<div class="timer-badge" id="memory-timer-badge" style="margin:0 auto 14px;justify-content:center;">⏱ ' + memoryTimeLeft + 's</div>' : '') +
      '<div class="memory-items">' + cards + '</div>' +
      '<div class="memory-actions"><button class="btn-primary" id="memory-memorized-btn">✅ Ich hab sie mir gemerkt</button></div>';
    document.getElementById('memory-memorized-btn').addEventListener('click', confirmMemorized);
    if (limit && memoryTimerInterval === null) startMemorizeTimer(limit);
    return;
  }

  if (memoryPhase === 'distractor') {
    const hiddenCards = memoryChallenge.items.map(() => '<div class="memory-card hidden-card">•••</div>').join('');
    const feedback = memoryDistractorResult === null ? '' :
      memoryDistractorResult
        ? '<p class="resolution-sub" style="text-align:center;color:var(--sage-dark);">Richtig! „' + memoryChallenge.distractor_answer + '“</p>'
        : '<p class="resolution-sub" style="text-align:center;color:var(--amber);">Nicht ganz – richtig wäre „' + memoryChallenge.distractor_answer + '“.</p>';
    $memoryContent.innerHTML =
      '<div class="memory-items">' + hiddenCards + '</div>' +
      '<p class="memory-prompt"><span class="big">Kurze Zwischenaufgabe</span><br>' +
      '<span class="sub">Wie lautet der ' + memoryChallenge.distractor_position + '. Buchstabe im Alphabet?</span></p>' +
      '<input id="memory-distractor-input" class="memory-letter-input" maxlength="1" autocomplete="off" ' +
        (memoryDistractorResult !== null ? 'disabled' : '') + ' value="' + escapeHtml(memoryDistractorInput) + '">' +
      feedback +
      '<div class="memory-actions">' +
        (memoryDistractorResult === null
          ? '<button class="btn-primary" id="memory-distractor-submit">Bestätigen</button>'
          : '<button class="btn-primary" id="memory-continue-btn">Weiter zur Abfrage</button>') +
      '</div>';
    if (memoryDistractorResult === null) {
      const $input = document.getElementById('memory-distractor-input');
      $input.focus();
      document.getElementById('memory-distractor-submit').addEventListener('click', submitDistractorAnswer);
      $input.addEventListener('keydown', e => { if (e.key === 'Enter') submitDistractorAnswer(); });
    } else {
      document.getElementById('memory-continue-btn').addEventListener('click', proceedToRecall);
    }
    return;
  }

  if (memoryPhase === 'recall') {
    const inputs = memoryChallenge.items.map((_, i) =>
      '<input class="memory-recall-input" type="text" autocomplete="off" placeholder="Begriff ' + (i + 1) + '" value="' + escapeHtml(memoryRecallValues[i] || '') + '">'
    ).join('');
    $memoryContent.innerHTML =
      '<p class="memory-prompt"><span class="big">Jetzt aus dem Gedächtnis</span><br>' +
      '<span class="sub">Gib die ' + memoryChallenge.items.length + ' Begriffe von vorhin ein (Reihenfolge egal).</span></p>' +
      '<div class="memory-recall-grid">' + inputs + '</div>' +
      '<div class="memory-actions"><button class="btn-primary" id="memory-submit-recall-btn">Auswerten</button></div>';
    document.getElementById('memory-submit-recall-btn').addEventListener('click', submitRecall);
    return;
  }

  if (memoryPhase === 'result') {
    renderMemoryResult();
    return;
  }
}

function renderMemoryResult() {
  const { correctCount, itemMatched, plays, saved, roundPoints, xpGained, overallBoard } = memoryResultData;
  const total = memoryChallenge.items.length;
  const myLevel = memoryLevelFromXp(playerMemoryXp);

  const rankIdx = player ? plays.findIndex(p => p.player_id === player.id) : -1;
  const rank = rankIdx >= 0 ? rankIdx + 1 : null;
  const better = rankIdx >= 0 ? plays.filter(p => p.correct_count < plays[rankIdx].correct_count).length : 0;
  const pctBetter = plays.length > 1 ? Math.round(better / (plays.length - 1) * 100) : (plays.length === 1 ? 100 : null);

  let statBoxes = '<div class="stat-box"><div class="num">' + correctCount + '/' + total + '</div><div class="lbl">richtig erinnert</div></div>';
  if (saved) {
    statBoxes += '<div class="stat-box"><div class="num">+' + roundPoints + '</div><div class="lbl">' + (xpGained > 0 ? 'Punkte (davon +' + xpGained + ' XP)' : 'Punkte') + '</div></div>';
    statBoxes += '<div class="stat-box"><div class="num">🏅 ' + myLevel + '</div><div class="lbl">' + playerMemoryXp + ' XP gesamt</div></div>';
  }
  if (saved && plays.length > 0) {
    statBoxes += '<div class="stat-box"><div class="num">' + (rank ? '#' + rank : '–') + '</div><div class="lbl">Platz von ' + plays.length + ' Spieler' + (plays.length === 1 ? '' : 'n') + '</div></div>';
    if (pctBetter !== null) {
      statBoxes += '<div class="stat-box"><div class="num">' + pctBetter + '%</div><div class="lbl">der Mitspieler geschlagen</div></div>';
    }
  }

  const reveal = memoryChallenge.items.map((item, i) =>
    '<div class="word-chip' + (itemMatched[i] ? ' bonus' : ' missed') + '">' +
      (itemMatched[i] ? '<span class="star">★</span> ' : '') + escapeHtml(item) + '</div>'
  ).join('');

  const rows = plays.map((e, i) => {
    const own = player && e.player_id === player.id;
    return '<div class="board-row' + (own ? ' own' : '') + '">' +
      '<div class="board-rank">' + (i + 1) + '</div>' +
      '<div class="board-main"><div class="board-score">' + escapeHtml(e.nickname) + ' · ' + e.correct_count + '/' + total + ' · ' + (e.points || 0) + ' Pkt</div></div>' +
    '</div>';
  }).join('');

  const overallRows = (overallBoard || []).map((e, i) => {
    const own = player && e.id === player.id;
    const lvl = memoryLevelFromXp(e.memory_xp || 0);
    return '<div class="board-row' + (own ? ' own' : '') + '">' +
      '<div class="board-rank">' + (i + 1) + '</div>' +
      '<div class="board-main">' +
        '<div class="board-score">' + escapeHtml(e.nickname) + ' · 🏅 Level ' + lvl + '</div>' +
        '<div class="board-meta">' + (e.memory_xp || 0) + ' XP gesamt</div>' +
      '</div>' +
    '</div>';
  }).join('');

  $memoryContent.innerHTML =
    '<div class="shelf">' +
      '<p class="resolution-title">🔍 Ergebnis</p>' +
      '<div class="stat-grid">' + statBoxes + '</div>' +
      '<p class="shelf-title" style="display:block; margin-bottom:8px;">Begriffe</p>' +
      '<div class="shelf-words">' + reveal + '</div>' +
    '</div>' +
    (saved ? '' : '<p class="resolution-sub" style="text-align:center;">Ohne Spitzname wird dein Ergebnis nicht in der Bestenliste gespeichert.</p>') +
    '<div class="memory-actions">' +
      '<button class="btn-primary" id="memory-retry-btn">Nochmal versuchen (gleiche Begriffe)</button>' +
      '<button class="pill-btn" id="memory-new-btn">🆕 Neue Begriffe starten</button>' +
    '</div>' +
    '<p class="board-section-title" style="margin-top:24px;">🏆 Rangliste dieser Übung</p>' +
    (plays.length === 0
      ? '<p class="board-empty">Noch keine Ergebnisse.</p>'
      : '<div class="board-list">' + rows + '</div>') +
    '<p class="board-section-title" style="margin-top:28px;">🏅 Gesamtrangliste · Level</p>' +
    (overallRows === ''
      ? '<p class="board-empty">Noch keine Punkte gesammelt.</p>'
      : '<div class="board-list">' + overallRows + '</div>');

  document.getElementById('memory-retry-btn').addEventListener('click', retryMemoryExercise);
  document.getElementById('memory-new-btn').addEventListener('click', startNewMemoryExercise);
}

/* ---------------- Card memory game (find the pairs) ---------------- */
// Reuses the level/XP curve from the recall game (memoryXpForLevel /
// memoryLevelFromXp) since it's a generic formula, but keeps its own XP
// pool (card_memory_xp) so progress in the two exercises stays separate.
const CARDMEM_SYMBOLS = [
  '🍎', '🍋', '🍇', '🍓', '🍉', '🍌', '🥕', '🌽', '🍄', '🌻',
  '🌸', '🍀', '🐝', '🐞', '🦋', '🐢', '🐬', '🐳', '⭐', '🌙',
  '☀️', '🌈', '💧', '🔥', '🎈', '🎵', '⚽', '🚗', '🏠', '❤️',
];
const CARDMEM_PAIR_COUNTS = [6, 8, 10, 12];
function cardmemPairCountForLevel(level) {
  const tier = Math.min(Math.floor((level - 1) / 3), CARDMEM_PAIR_COUNTS.length - 1);
  return CARDMEM_PAIR_COUNTS[tier];
}
function cardmemColumnsForPairCount(pairCount) {
  return { 6: 4, 8: 4, 10: 5, 12: 6 }[pairCount] || 4;
}
function cardmemPeekSeconds(pairCount) {
  if (pairCount <= 6) return 3;
  if (pairCount <= 8) return 2;
  return null;
}
function cardmemPointsPerPair(pairCount) { return 10 + (pairCount - 6) * 3; }
function cardmemRoundPoints(pairCount, moves) {
  const efficient = moves <= Math.round(pairCount * 1.5);
  return pairCount * cardmemPointsPerPair(pairCount) + (efficient ? 20 : 0);
}

function generateCardLayout(pairCount) {
  const pool = [...CARDMEM_SYMBOLS];
  const chosen = [];
  while (chosen.length < pairCount && pool.length) {
    const idx = Math.floor(Math.random() * pool.length);
    chosen.push(pool[idx]);
    pool.splice(idx, 1);
  }
  const deck = chosen.concat(chosen);
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  return deck;
}

let cardmemPhase = 'idle'; // idle | loading | peek | playing | result
let cardmemChallenge = null; // { id, pair_count, layout }
let cardmemMatched = [];
let cardmemRevealed = [];
let cardmemMoves = 0;
let cardmemLocked = false;
let cardmemResultData = null;
let cardmemPeekTimer = null;
let playerCardMemoryXp = 0;

async function refreshPlayerCardMemoryXp() {
  if (!sb || !player || !player.id) { playerCardMemoryXp = 0; return; }
  const { data, error } = await sb.from('wortspiel_players').select('card_memory_xp').eq('id', player.id).maybeSingle();
  if (error) { console.error(error); return; }
  playerCardMemoryXp = (data && data.card_memory_xp) || 0;
}

async function getCurrentCardChallenge(pairCount) {
  if (!sb) return null;
  const { data: existing, error: selErr } = await sb.from('wortspiel_card_challenges')
    .select('*').eq('pair_count', pairCount).order('created_at', { ascending: false }).limit(1).maybeSingle();
  if (selErr) { console.error(selErr); return null; }
  if (existing) return existing;
  return createCardChallenge(pairCount);
}

async function createCardChallenge(pairCount) {
  if (!sb) return null;
  const layout = generateCardLayout(pairCount);
  const { data, error } = await sb.from('wortspiel_card_challenges').insert({ pair_count: pairCount, layout }).select().maybeSingle();
  if (error) { console.error(error); return null; }
  return data;
}

function stopCardPeekTimer() {
  if (cardmemPeekTimer) { clearTimeout(cardmemPeekTimer); cardmemPeekTimer = null; }
}

function beginCardRound() {
  stopCardPeekTimer();
  cardmemRevealed = [];
  cardmemMoves = 0;
  cardmemLocked = false;
  cardmemResultData = null;
  cardmemMatched = new Array(cardmemChallenge.layout.length).fill(false);
  const peek = cardmemPeekSeconds(cardmemChallenge.pair_count);
  if (peek) {
    cardmemPhase = 'peek';
    renderCardMemoryView();
    cardmemPeekTimer = setTimeout(() => {
      cardmemPeekTimer = null;
      cardmemPhase = 'playing';
      renderCardMemoryView();
    }, peek * 1000);
  } else {
    cardmemPhase = 'playing';
    renderCardMemoryView();
  }
}

async function startCardMemoryExercise() {
  stopCardPeekTimer();
  cardmemResultData = null;
  cardmemPhase = 'loading';
  renderCardMemoryView();
  await refreshPlayerCardMemoryXp();
  const pairCount = cardmemPairCountForLevel(memoryLevelFromXp(playerCardMemoryXp));
  cardmemChallenge = await getCurrentCardChallenge(pairCount);
  if (!cardmemChallenge) {
    cardmemPhase = 'idle';
    renderCardMemoryView('Übung konnte nicht geladen werden. Prüfe deine Internetverbindung.');
    return;
  }
  beginCardRound();
}

function retryCardMemoryExercise() {
  beginCardRound();
}

async function startNewCardMemoryExercise() {
  if (!sb) return;
  const ok = window.confirm('Neues Karten-Memory mit neuem Layout starten? Alle, die ab jetzt mitspielen, bekommen diese neue Runde statt der bisherigen.');
  if (!ok) return;
  stopCardPeekTimer();
  cardmemPhase = 'loading';
  renderCardMemoryView();
  await refreshPlayerCardMemoryXp();
  const pairCount = cardmemPairCountForLevel(memoryLevelFromXp(playerCardMemoryXp));
  const created = await createCardChallenge(pairCount);
  if (!created) {
    cardmemPhase = 'idle';
    renderCardMemoryView('Neue Übung konnte nicht erstellt werden. Prüfe deine Internetverbindung.');
    return;
  }
  cardmemChallenge = created;
  beginCardRound();
}

function handleCardClick(idx) {
  if (cardmemPhase !== 'playing' || cardmemLocked) return;
  if (cardmemMatched[idx] || cardmemRevealed.includes(idx)) return;
  cardmemRevealed.push(idx);
  if (cardmemRevealed.length < 2) {
    renderCardMemoryView();
    return;
  }
  cardmemMoves++;
  const [a, b] = cardmemRevealed;
  if (cardmemChallenge.layout[a] === cardmemChallenge.layout[b]) {
    cardmemMatched[a] = true;
    cardmemMatched[b] = true;
    cardmemRevealed = [];
    renderCardMemoryView();
    if (cardmemMatched.every(Boolean)) finishCardRound();
  } else {
    cardmemLocked = true;
    renderCardMemoryView();
    setTimeout(() => {
      cardmemRevealed = [];
      cardmemLocked = false;
      renderCardMemoryView();
    }, 900);
  }
}

async function finishCardRound() {
  const pairCount = cardmemChallenge.pair_count;
  const roundPoints = cardmemRoundPoints(pairCount, cardmemMoves);
  const finishedMoves = cardmemMoves;

  cardmemPhase = 'loading';
  renderCardMemoryView();

  const p = await ensurePlayer();
  let plays = [];
  let xpGained = 0;
  let overallBoard = [];
  if (p) {
    const { data: existing } = await sb.from('wortspiel_card_plays')
      .select('*').eq('challenge_id', cardmemChallenge.id).eq('player_id', p.id).maybeSingle();
    if (!existing || finishedMoves < existing.moves) {
      const row = {
        challenge_id: cardmemChallenge.id, player_id: p.id, nickname: p.nickname,
        moves: finishedMoves, points: roundPoints, player_level: memoryLevelFromXp(playerCardMemoryXp),
        updated_at: new Date().toISOString(),
      };
      const { error } = await sb.from('wortspiel_card_plays')
        .upsert(row, { onConflict: 'challenge_id,player_id' });
      if (error) console.error(error);
      xpGained = roundPoints - (existing ? existing.points : 0);
      if (xpGained > 0) {
        const newXp = playerCardMemoryXp + xpGained;
        const { error: xpErr } = await sb.from('wortspiel_players').update({ card_memory_xp: newXp }).eq('id', p.id);
        if (xpErr) console.error(xpErr); else playerCardMemoryXp = newXp;
      }
    }
    const { data } = await sb.from('wortspiel_card_plays')
      .select('*').eq('challenge_id', cardmemChallenge.id).order('moves', { ascending: true });
    plays = data || [];
    const { data: boardData } = await sb.from('wortspiel_players')
      .select('id,nickname,card_memory_xp').gt('card_memory_xp', 0).order('card_memory_xp', { ascending: false }).limit(10);
    overallBoard = boardData || [];
  }

  cardmemResultData = { moves: finishedMoves, roundPoints, xpGained, plays, overallBoard, saved: !!p };
  cardmemPhase = 'result';
  renderCardMemoryView();
}

      (errorMessage ? '<p style="text-align:center; color:var(--amber);">' + escapeHtml(errorMessage) + '</p>' : '') +

  $cardMemoryContent.innerHTML =

      '<p class="resolution-title">🔍 Ergebnis</p>' +

    '</div>' +

    '</div>' +

  document.getElementById('cardmemory-retry-btn').addEventListener('click', retryCardMemoryExercise);
