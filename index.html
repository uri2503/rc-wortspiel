/* ---------------- Mahjong (layered tile matching) ---------------- */
// Unlike the card-flip memory game, every tile is face-up from the start --
// the challenge is spatial/strategic (which free pair to clear first so you
// don't box yourself in), not recall. Own XP pool (mahjong_xp), same generic
// level curve as the other exercises.
//
// Layout: each tier is a stack of centered, integer-aligned grids (no true
// diagonal mahjong overlap, to keep the geometry simple) -- tier[0] is the
// widest/bottom layer, later entries are smaller layers centered on top and
// sharing tier[0]'s row/col coordinate space, so "is this cell covered by a
// higher layer" is just an exact (row,col) match at a greater layer index.
const MAHJONG_LAYOUTS = [
  [{ cols: 4, rows: 3 }, { cols: 2, rows: 2 }],                      // 16 tiles -> 8 pairs
  [{ cols: 6, rows: 3 }, { cols: 4, rows: 1 }, { cols: 2, rows: 1 }], // 24 tiles -> 12 pairs
  [{ cols: 6, rows: 4 }, { cols: 4, rows: 2 }],                      // 32 tiles -> 16 pairs
  [{ cols: 8, rows: 4 }, { cols: 4, rows: 2 }],                      // 40 tiles -> 20 pairs
];
// Real Mahjong tile glyphs (Characters, Bamboos, Circles, Winds, Dragons) --
// deliberately not the fruit/animal emoji from the card-flip game, so the two
// exercises don't look like reskins of each other.
const MAHJONG_SYMBOLS = [
  '🀇', '🀈', '🀉', '🀊', '🀋', '🀌', '🀍', '🀎', '🀏',
  '🀐', '🀑', '🀒', '🀓', '🀔', '🀕', '🀖', '🀗', '🀘',
  '🀙', '🀚', '🀛', '🀜', '🀝', '🀞', '🀟', '🀠', '🀡',
  '🀀', '🀁', '🀂', '🀃', '🀄', '🀅', '🀆',
];
const MAHJONG_LAYER_COLORS = ['var(--tile-border)', 'var(--ochre)', 'var(--amber)'];
// One color per suit so the tile glyphs (which render fairly plain/inky by
// default) read as lively and easy to tell apart at a glance.
const MAHJONG_SYMBOL_COLORS = {};
MAHJONG_SYMBOLS.slice(0, 9).forEach(s => MAHJONG_SYMBOL_COLORS[s] = 'var(--mj-red)');    // characters
MAHJONG_SYMBOLS.slice(9, 18).forEach(s => MAHJONG_SYMBOL_COLORS[s] = 'var(--sage-dark)'); // bamboos
MAHJONG_SYMBOLS.slice(18, 27).forEach(s => MAHJONG_SYMBOL_COLORS[s] = 'var(--mj-blue)');  // circles
MAHJONG_SYMBOLS.slice(27, 31).forEach(s => MAHJONG_SYMBOL_COLORS[s] = 'var(--ochre)');    // winds
MAHJONG_SYMBOL_COLORS[MAHJONG_SYMBOLS[31]] = 'var(--mj-red)';    // red dragon
MAHJONG_SYMBOL_COLORS[MAHJONG_SYMBOLS[32]] = 'var(--sage-dark)'; // green dragon
MAHJONG_SYMBOL_COLORS[MAHJONG_SYMBOLS[33]] = 'var(--ink-soft)';  // white dragon
function mahjongTierForLevel(level) { return Math.min(Math.floor((level - 1) / 3), MAHJONG_LAYOUTS.length - 1); }
function mahjongPointsPerPair(pairCount) { return 12 + (pairCount - 8) * 2; }
function mahjongRoundPoints(pairCount, pairsCleared, seconds, solved) {
  const base = pairsCleared * mahjongPointsPerPair(pairCount);
  const speedBonus = (solved && seconds <= pairCount * 8) ? 25 : 0;
  return base + speedBonus;
}

function buildMahjongCells(tier) {
  const tiers = MAHJONG_LAYOUTS[tier];
  const cells = [];
  tiers.forEach((t, layer) => {
    const rowOff = Math.floor((tiers[0].rows - t.rows) / 2);
    const colOff = Math.floor((tiers[0].cols - t.cols) / 2);
    for (let r = 0; r < t.rows; r++) {
      for (let c = 0; c < t.cols; c++) {
        cells.push({ layer, row: r + rowOff, col: c + colOff });
      }
    }
  });
  return cells;
}

// A cell is free if nothing present sits directly above it (same row/col,
// higher layer) and it isn't blocked on *both* sides by present tiles in the
// same layer and row.
function mahjongCellFree(cells, isPresent, idx) {
  const cell = cells[idx];
  for (let i = 0; i < cells.length; i++) {
    if (i === idx || !isPresent(i)) continue;
    const c = cells[i];
    if (c.layer > cell.layer && c.row === cell.row && c.col === cell.col) return false;
  }
  let leftBlocked = false, rightBlocked = false;
  for (let i = 0; i < cells.length; i++) {
    if (i === idx || !isPresent(i)) continue;
    const c = cells[i];
    if (c.layer === cell.layer && c.row === cell.row) {
      if (c.col === cell.col - 1) leftBlocked = true;
      else if (c.col === cell.col + 1) rightBlocked = true;
    }
  }
  return !(leftBlocked && rightBlocked);
}

function tryBuildMahjongRemovalOrder(cells) {
  const present = new Set(cells.map((_, i) => i));
  const pairsOrder = [];
  let guard = 0;
  while (present.size > 0 && guard < cells.length * 2) {
    guard++;
    const freeIdx = [...present].filter(i => mahjongCellFree(cells, k => present.has(k), i));
    if (freeIdx.length < 2) break;
    for (let i = freeIdx.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [freeIdx[i], freeIdx[j]] = [freeIdx[j], freeIdx[i]];
    }
    const a = freeIdx[0], b = freeIdx[1];
    pairsOrder.push([a, b]);
    present.delete(a);
    present.delete(b);
  }
  return { pairsOrder, stuckLeftover: present.size, leftover: [...present] };
}

// Builds a *guaranteed solvable* symbol assignment: simulate a full,
// structure-only removal of the board two free cells at a time, then assign
// each simulated pair the same random symbol. Replaying that exact recorded
// order in the real game is then trivially a legal solve. The random order
// can occasionally deadlock (e.g. a stacked pair left as the last two cells,
// where only the top one is ever free) -- retry a few times, which resolves
// it almost immediately since it's a matter of unlucky ordering, not a flaw
// in the layout itself.
function generateMahjongTiles(cells, symbolPool) {
  let best = tryBuildMahjongRemovalOrder(cells);
  for (let attempt = 0; attempt < 25 && best.stuckLeftover > 0; attempt++) {
    best = tryBuildMahjongRemovalOrder(cells);
  }
  const { pairsOrder, leftover } = best;
  for (let i = 0; i + 1 < leftover.length; i += 2) pairsOrder.push([leftover[i], leftover[i + 1]]);

  const symbols = [...symbolPool];
  for (let i = symbols.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [symbols[i], symbols[j]] = [symbols[j], symbols[i]];
  }
  const tileSymbols = new Array(cells.length);
  pairsOrder.forEach(([a, b], pairIdx) => {
    const sym = symbols[pairIdx % symbols.length];
    tileSymbols[a] = sym;
    tileSymbols[b] = sym;
  });
  return tileSymbols;
}

let mahjongPhase = 'idle'; // idle | loading | playing | result
let mahjongChallenge = null; // { id, tier, pair_count, symbols }
let mahjongCells = [];
let mahjongMatched = [];
let mahjongSelected = null;
let mahjongPairsCleared = 0;
let mahjongStartedAt = null;
let mahjongTimerInterval = null;
let mahjongElapsedSeconds = 0;
let mahjongResultData = null;
let playerMahjongXp = 0;

function formatMahjongTime(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return m + ':' + String(s).padStart(2, '0');
}
function stopMahjongTimer() {
  if (mahjongTimerInterval) { clearInterval(mahjongTimerInterval); mahjongTimerInterval = null; }
}
function startMahjongTimer() {
  stopMahjongTimer();
  mahjongStartedAt = Date.now();
  mahjongElapsedSeconds = 0;
  mahjongTimerInterval = setInterval(() => {
    mahjongElapsedSeconds = Math.floor((Date.now() - mahjongStartedAt) / 1000);
    const $b = document.getElementById('mahjong-timer-badge');
    if ($b) $b.textContent = formatMahjongTime(mahjongElapsedSeconds);
  }, 1000);
}

async function refreshPlayerMahjongXp() {
  if (!sb || !player || !player.id) { playerMahjongXp = 0; return; }
  const { data, error } = await sb.from('wortspiel_players').select('mahjong_xp').eq('id', player.id).maybeSingle();
  if (error) { console.error(error); return; }
  playerMahjongXp = (data && data.mahjong_xp) || 0;
}

async function getCurrentMahjongChallenge(tier) {
  if (!sb) return null;
  const { data: existing, error: selErr } = await sb.from('wortspiel_mahjong_challenges')
    .select('*').eq('tier', tier).order('created_at', { ascending: false }).limit(1).maybeSingle();
  if (selErr) { console.error(selErr); return null; }
  if (existing) return existing;
  return createMahjongChallenge(tier);
}

async function createMahjongChallenge(tier) {
  if (!sb) return null;
  const cells = buildMahjongCells(tier);
  const tileSymbols = generateMahjongTiles(cells, MAHJONG_SYMBOLS);
  const { data, error } = await sb.from('wortspiel_mahjong_challenges')
    .insert({ tier, pair_count: cells.length / 2, symbols: tileSymbols }).select().maybeSingle();
  if (error) { console.error(error); return null; }
  return data;
}

function beginMahjongRound() {
  mahjongCells = buildMahjongCells(mahjongChallenge.tier);
  mahjongMatched = new Array(mahjongCells.length).fill(false);
  mahjongSelected = null;
  mahjongPairsCleared = 0;
  mahjongResultData = null;
  mahjongPhase = 'playing';
  startMahjongTimer();
  renderMahjongView();
}

async function startMahjongExercise() {
  stopMahjongTimer();
  mahjongResultData = null;
  mahjongPhase = 'loading';
  renderMahjongView();
  await refreshPlayerMahjongXp();
  const tier = mahjongTierForLevel(memoryLevelFromXp(playerMahjongXp));
  mahjongChallenge = await getCurrentMahjongChallenge(tier);
  if (!mahjongChallenge) {
    mahjongPhase = 'idle';
    renderMahjongView('Übung konnte nicht geladen werden. Prüfe deine Internetverbindung.');
    return;
  }
  beginMahjongRound();
}

function retryMahjongExercise() {
  beginMahjongRound();
}

async function startNewMahjongExercise() {
  if (!sb) return;
  const ok = window.confirm('Neues Mahjong-Layout starten? Alle, die ab jetzt mitspielen, bekommen dieses neue Layout statt des bisherigen.');
  if (!ok) return;
  stopMahjongTimer();
  mahjongPhase = 'loading';
  renderMahjongView();
  await refreshPlayerMahjongXp();
  const tier = mahjongTierForLevel(memoryLevelFromXp(playerMahjongXp));
  const created = await createMahjongChallenge(tier);
  if (!created) {
    mahjongPhase = 'idle';
    renderMahjongView('Neues Layout konnte nicht erstellt werden. Prüfe deine Internetverbindung.');
    return;
  }
  mahjongChallenge = created;
  beginMahjongRound();
}

function mahjongVisibleTiles() {
  const byCell = new Map();
  mahjongCells.forEach((c, i) => {
    const key = c.row + ',' + c.col;
    if (!byCell.has(key)) byCell.set(key, []);
    byCell.get(key).push(i);
  });
  const visible = [];
  byCell.forEach(indices => {
    const present = indices.filter(i => !mahjongMatched[i]).sort((a, b) => mahjongCells[b].layer - mahjongCells[a].layer);
    if (present.length) visible.push(present[0]);
  });
  return visible;
}
function mahjongFreeTiles() {
  return mahjongVisibleTiles().filter(i => mahjongCellFree(mahjongCells, k => !mahjongMatched[k], i));
}
function mahjongHasMovesLeft() {
  const seen = {};
  for (const i of mahjongFreeTiles()) {
    const sym = mahjongChallenge.symbols[i];
    if (seen[sym]) return true;
    seen[sym] = true;
  }
  return false;
}

function handleMahjongTileClick(idx) {
  if (mahjongPhase !== 'playing') return;
  const free = new Set(mahjongFreeTiles());
  if (!free.has(idx)) return;
  if (mahjongSelected === idx) { mahjongSelected = null; renderMahjongView(); return; }
  if (mahjongSelected === null) { mahjongSelected = idx; renderMahjongView(); return; }
  const a = mahjongSelected, b = idx;
  if (mahjongChallenge.symbols[a] === mahjongChallenge.symbols[b]) {
    mahjongMatched[a] = true;
    mahjongMatched[b] = true;
    mahjongSelected = null;
    mahjongPairsCleared++;
    if (mahjongMatched.every(Boolean)) { finishMahjongRound(true); return; }
    renderMahjongView();
  } else {
    mahjongSelected = idx;
    renderMahjongView();
  }
}

async function finishMahjongRound(solved) {
  stopMahjongTimer();
  const pairCount = mahjongChallenge.pair_count;
  const seconds = mahjongElapsedSeconds;
  const pairsCleared = mahjongPairsCleared;
  const roundPoints = mahjongRoundPoints(pairCount, pairsCleared, seconds, solved);

  mahjongPhase = 'loading';
  renderMahjongView();

  const p = await ensurePlayer();
  let plays = [];
  let xpGained = 0;
  let overallBoard = [];
  if (p) {
    const { data: existing } = await sb.from('wortspiel_mahjong_plays')
      .select('*').eq('challenge_id', mahjongChallenge.id).eq('player_id', p.id).maybeSingle();
    if (!existing || roundPoints > existing.points) {
      const row = {
        challenge_id: mahjongChallenge.id, player_id: p.id, nickname: p.nickname,
        pairs_cleared: pairsCleared, solved, seconds, points: roundPoints,
        player_level: memoryLevelFromXp(playerMahjongXp), updated_at: new Date().toISOString(),
      };
      const { error } = await sb.from('wortspiel_mahjong_plays')
        .upsert(row, { onConflict: 'challenge_id,player_id' });
      if (error) console.error(error);
      xpGained = roundPoints - (existing ? existing.points : 0);
      if (xpGained > 0) {
        const newXp = playerMahjongXp + xpGained;
        const { error: xpErr } = await sb.from('wortspiel_players').update({ mahjong_xp: newXp }).eq('id', p.id);
        if (xpErr) console.error(xpErr); else playerMahjongXp = newXp;
      }
    }
    const { data } = await sb.from('wortspiel_mahjong_plays')
      .select('*').eq('challenge_id', mahjongChallenge.id).order('points', { ascending: false });
    plays = data || [];
    const { data: boardData } = await sb.from('wortspiel_players')
      .select('id,nickname,mahjong_xp').gt('mahjong_xp', 0).order('mahjong_xp', { ascending: false }).limit(10);
    overallBoard = boardData || [];
  }

  mahjongResultData = { pairsCleared, pairCount, solved, seconds, roundPoints, xpGained, plays, overallBoard, saved: !!p };
  mahjongPhase = 'result';
  renderMahjongView();
}

  }

  if (mahjongPhase === 'idle') {
    const lvl = memoryLevelFromXp(playerMahjongXp);
    const tier = mahjongTierForLevel(lvl);
    const pairCount = MAHJONG_LAYOUTS[tier].reduce((sum, t) => sum + t.cols * t.rows, 0) / 2;
    $mahjongContent.innerHTML =
      '<p class="memory-prompt"><span class="big">🀄 Mahjong</span><br>' +
      '<span class="sub">Finde alle ' + pairCount + ' Paare gleicher Steine. Nur oben liegende, seitlich freie Steine sind wählbar.</span></p>' +
      (errorMessage ? '<p style="text-align:center; color:var(--amber);">' + escapeHtml(errorMessage) + '</p>' : '') +
      '<div class="memory-actions"><button class="btn-primary" id="mahjong-start-btn">Übung starten</button></div>';
    document.getElementById('mahjong-start-btn').addEventListener('click', startMahjongExercise);
    if (player && player.id) {
      refreshPlayerMahjongXp().then(() => { if (mahjongPhase === 'idle') renderMahjongPlayerRow(); });
    }
    return;
  }

  if (!mahjongChallenge) { $mahjongContent.innerHTML = '<p class="board-empty">Keine aktive Übung.</p>'; return; }

  if (mahjongPhase === 'playing') {
    const cols = MAHJONG_LAYOUTS[mahjongChallenge.tier][0].cols;
    const visible = mahjongVisibleTiles();
    const freeSet = new Set(mahjongFreeTiles());
    const tiles = visible.map(i => {
      const cell = mahjongCells[i];
      const isFree = freeSet.has(i);
      const isSelected = mahjongSelected === i;
      const cls = 'mahjong-tile' + (isFree ? '' : ' blocked') + (isSelected ? ' selected' : '');
      const offset = cell.layer * 6;
      // Higher layers get a warmer border/shadow so the stack reads clearly;
      // skipped when selected so the selection highlight isn't fought over.
      const layerColor = MAHJONG_LAYER_COLORS[Math.min(cell.layer, MAHJONG_LAYER_COLORS.length - 1)];
      const layerStyle = (isSelected || cell.layer === 0) ? '' :
        ('border-color:' + layerColor + ';box-shadow:0 ' + (3 + cell.layer * 2) + 'px 0 ' + layerColor + ';');
      const symbolColor = MAHJONG_SYMBOL_COLORS[mahjongChallenge.symbols[i]] || 'var(--ink)';
      const style = 'grid-column:' + (cell.col + 1) + ';grid-row:' + (cell.row + 1) +
        ';transform:translate(-' + offset + 'px,-' + offset + 'px);z-index:' + (cell.layer + 1) +
        ';color:' + symbolColor + ';' + layerStyle;
      return '<button type="button" class="' + cls + '" style="' + style + '" data-idx="' + i + '">' + mahjongChallenge.symbols[i] + '</button>';
    }).join('');
    const stuck = !mahjongMatched.every(Boolean) && !mahjongHasMovesLeft();
    $mahjongContent.innerHTML =
      '<p class="memory-prompt"><span class="big">Finde die Paare</span><br>' +
      '<span class="sub">' + mahjongChallenge.pair_count + ' Paare · ' + mahjongPairsCleared + ' gefunden · <span id="mahjong-timer-badge">' + formatMahjongTime(mahjongElapsedSeconds) + '</span></span></p>' +
      (stuck ? '<div class="mahjong-banner">😕 Keine Züge mehr möglich. Mische neu oder werte die Runde jetzt.</div>' : '') +
      '<div class="mahjong-grid" style="grid-template-columns: repeat(' + cols + ', 1fr);">' + tiles + '</div>' +
      (stuck
        ? '<div class="memory-actions"><button class="btn-primary" id="mahjong-new-btn">🔀 Neu mischen</button><button class="pill-btn" id="mahjong-give-up-btn">Runde werten &amp; beenden</button></div>'
        : '');
    Array.from($mahjongContent.querySelectorAll('.mahjong-tile')).forEach($t => {
      $t.addEventListener('click', () => handleMahjongTileClick(parseInt($t.dataset.idx, 10)));
    });
    if (stuck) {
      document.getElementById('mahjong-new-btn').addEventListener('click', startNewMahjongExercise);
      document.getElementById('mahjong-give-up-btn').addEventListener('click', () => finishMahjongRound(false));
    }
    return;
  }

  if (mahjongPhase === 'result') {
    renderMahjongResult();
    return;
  }
}

      '<p class="resolution-title">🔍 Ergebnis</p>' +

/* ---------------- Simon (growing sequence recall) ---------------- */
// A different memory skill again: sequential/serial recall rather than the
// pairs-matching or spatial-planning of the other exercises. There's no
// shared "challenge" concept here -- each run is its own randomly generated,
// ever-growing sequence, closer to an arcade high score than a shared
// puzzle, so the data model is simpler than the other three games: one row
// per player, kept at their personal best.
const SIMON_PAD_COUNTS = [4, 5, 6, 7, 8];
const SIMON_PAD_COLORS = ['var(--sage)', 'var(--mj-red)', 'var(--mj-blue)', 'var(--amber)', 'var(--mj-purple)', 'var(--ochre)', 'var(--mj-teal)', 'var(--sage-dark)'];
function simonPadCountForLevel(level) { return SIMON_PAD_COUNTS[Math.min(Math.floor((level - 1) / 3), SIMON_PAD_COUNTS.length - 1)]; }
function simonColsForPadCount(padCount) { return padCount <= 4 ? 2 : padCount <= 6 ? 3 : 4; }
function simonFlashDuration(level) { return Math.max(280, 700 - level * 25); }
function simonGapDuration(level) { return Math.max(150, 380 - level * 15); }
function simonPointsPerStep(padCount) { return 8 + (padCount - 4) * 4; }
function simonRoundPoints(padCount, reached) { return reached * simonPointsPerStep(padCount); }

let simonPhase = 'idle'; // idle | loading | showing | input | roundcomplete | result
let simonPadCount = 4;
let simonSequence = [];
let simonInputIndex = 0;
let simonActivePad = null;
let simonTimer = null;
let simonResultData = null;
let playerSimonXp = 0;

function stopSimonTimer() {
  if (simonTimer) { clearTimeout(simonTimer); simonTimer = null; }
}

async function refreshPlayerSimonXp() {
  if (!sb || !player || !player.id) { playerSimonXp = 0; return; }
  const { data, error } = await sb.from('wortspiel_players').select('simon_xp').eq('id', player.id).maybeSingle();
  if (error) { console.error(error); return; }
  playerSimonXp = (data && data.simon_xp) || 0;
}

function simonRandomPad() { return Math.floor(Math.random() * simonPadCount); }

function playSimonSequence() {
  simonPhase = 'showing';
  simonActivePad = null;
  renderSimonView();
  const level = memoryLevelFromXp(playerSimonXp);
  const flashMs = simonFlashDuration(level);
  const gapMs = simonGapDuration(level);
  let i = 0;
  const step = () => {
    if (i >= simonSequence.length) {
      simonPhase = 'input';
      simonInputIndex = 0;
      simonActivePad = null;
      renderSimonView();
      return;
    }
    simonActivePad = simonSequence[i];
    renderSimonView();
    simonTimer = setTimeout(() => {
      simonActivePad = null;
      renderSimonView();
      simonTimer = setTimeout(() => { i++; step(); }, gapMs);
    }, flashMs);
  };
  step();
}

async function startSimonExercise() {
  stopSimonTimer();
  simonResultData = null;
  simonPhase = 'loading';
  renderSimonView();
  await refreshPlayerSimonXp();
  const level = memoryLevelFromXp(playerSimonXp);
  simonPadCount = simonPadCountForLevel(level);
  simonSequence = [simonRandomPad()];
  playSimonSequence();
}

function handleSimonPadClick(padIdx) {
  if (simonPhase !== 'input') return;
  if (padIdx !== simonSequence[simonInputIndex]) {
    finishSimonRun();
    return;
  }
  simonInputIndex++;
  if (simonInputIndex >= simonSequence.length) {
    simonSequence.push(simonRandomPad());
    simonPhase = 'roundcomplete';
    renderSimonView();
    simonTimer = setTimeout(() => playSimonSequence(), 700);
  } else {
    renderSimonView();
  }
}

async function finishSimonRun() {
  stopSimonTimer();
  const reached = simonSequence.length - 1;
  const padCount = simonPadCount;
  const roundPoints = simonRoundPoints(padCount, reached);

  simonPhase = 'loading';
  renderSimonView();

  const p = await ensurePlayer();
  let plays = [];
  let xpGained = 0;
  let overallBoard = [];
  if (p) {
    const { data: existing } = await sb.from('wortspiel_simon_plays')
      .select('*').eq('player_id', p.id).maybeSingle();
    if (!existing || roundPoints > existing.points) {
      const row = {
        player_id: p.id, nickname: p.nickname,
        best_sequence: reached, pad_count: padCount, points: roundPoints,
        player_level: memoryLevelFromXp(playerSimonXp), updated_at: new Date().toISOString(),
      };
      const { error } = await sb.from('wortspiel_simon_plays')
        .upsert(row, { onConflict: 'player_id' });
      if (error) console.error(error);
      xpGained = roundPoints - (existing ? existing.points : 0);
      if (xpGained > 0) {
        const newXp = playerSimonXp + xpGained;
        const { error: xpErr } = await sb.from('wortspiel_players').update({ simon_xp: newXp }).eq('id', p.id);
        if (xpErr) console.error(xpErr); else playerSimonXp = newXp;
      }
    }
    const { data } = await sb.from('wortspiel_simon_plays')
      .select('*').order('points', { ascending: false }).limit(10);
    plays = data || [];
    const { data: boardData } = await sb.from('wortspiel_players')
      .select('id,nickname,simon_xp').gt('simon_xp', 0).order('simon_xp', { ascending: false }).limit(10);
    overallBoard = boardData || [];
  }

  simonResultData = { reached, padCount, roundPoints, xpGained, plays, overallBoard, saved: !!p };
  simonPhase = 'result';
  renderSimonView();
}

function renderSimonPlayerRow() {
  const $row = document.getElementById('simon-player-row');
  if (!$row) return;
  if (player && player.nickname) {
    const lvl = memoryLevelFromXp(playerSimonXp);
    const toNext = memoryXpForLevel(lvl + 1) - playerSimonXp;
    $row.innerHTML = '👤 ' + escapeHtml(player.nickname) +
      ' <span class="pill-btn" style="cursor:default;padding:4px 12px;font-size:13px;" title="noch ' + toNext + ' XP bis Level ' + (lvl + 1) + '">🏅 Level ' + lvl + ' · ' + playerSimonXp + ' XP</span>' +
      ' <button type="button" class="link-btn" id="simon-change-nickname-btn">Spitzname ändern</button>';
  } else {
    $row.innerHTML = 'Noch kein Spitzname gewählt <button type="button" class="link-btn" id="simon-change-nickname-btn">Spitzname wählen</button>';
  }
  document.getElementById('simon-change-nickname-btn').addEventListener('click', async () => {
    await renameNickname();
    await refreshPlayerSimonXp();
    renderSimonPlayerRow();
  });
}

function renderSimonPadsHtml(disabled) {
  const cols = simonColsForPadCount(simonPadCount);
  const pads = [];
  for (let i = 0; i < simonPadCount; i++) {
    const isLit = simonActivePad === i;
    const cls = 'simon-pad' + (isLit ? ' lit' : '') + (disabled ? ' disabled' : '');
    const color = SIMON_PAD_COLORS[i % SIMON_PAD_COLORS.length];
    pads.push('<button type="button" class="' + cls + '" style="background:' + color + ';" data-idx="' + i + '"' + (disabled ? ' disabled' : '') + '></button>');
  }
  return '<div class="simon-grid" style="grid-template-columns: repeat(' + cols + ', 1fr);">' + pads.join('') + '</div>';
}

function renderSimonView(errorMessage) {
  if (!$simonContent) return;
  renderSimonPlayerRow();

  if (simonPhase === 'loading') {
    $simonContent.innerHTML = '<p class="board-empty">Lädt …</p>';
    return;
  }

  if (simonPhase === 'idle') {
    const lvl = memoryLevelFromXp(playerSimonXp);
    const padCount = simonPadCountForLevel(lvl);
    $simonContent.innerHTML =
      '<p class="memory-prompt"><span class="big">🎯 Simon</span><br>' +
      '<span class="sub">Merk dir die Reihenfolge der aufleuchtenden Felder und tippe sie in gleicher Reihenfolge nach. Nach jeder Runde wird die Folge um ein Feld länger. Aktuell: ' + padCount + ' Felder.</span></p>' +
      (errorMessage ? '<p style="text-align:center; color:var(--amber);">' + escapeHtml(errorMessage) + '</p>' : '') +
      '<div class="memory-actions"><button class="btn-primary" id="simon-start-btn">Übung starten</button></div>';
    document.getElementById('simon-start-btn').addEventListener('click', startSimonExercise);
    if (player && player.id) {
      refreshPlayerSimonXp().then(() => { if (simonPhase === 'idle') renderSimonPlayerRow(); });
    }
    return;
  }

  if (simonPhase === 'roundcomplete') {
    $simonContent.innerHTML =
      '<p class="simon-status">✅ Richtig! Nächste Runde …</p>' +
      renderSimonPadsHtml(true);
    return;
  }

  if (simonPhase === 'showing' || simonPhase === 'input') {
    const statusText = simonPhase === 'showing'
      ? 'Schau genau hin …'
      : 'Jetzt du: Feld ' + (simonInputIndex + 1) + ' von ' + simonSequence.length;
    $simonContent.innerHTML =
      '<p class="simon-status">' + statusText + '</p>' +
      renderSimonPadsHtml(simonPhase !== 'input');
    if (simonPhase === 'input') {
      Array.from($simonContent.querySelectorAll('.simon-pad')).forEach($p => {
        $p.addEventListener('click', () => handleSimonPadClick(parseInt($p.dataset.idx, 10)));
      });
    }
    return;
  }

  if (simonPhase === 'result') {
    renderSimonResult();
    return;
  }
}

    statBoxes += '<div class="stat-box"><div class="num">🏅 ' + myLevel + '</div><div class="lbl">' + playerSimonXp + ' XP gesamt</div></div>';

    if (pctBetter !== null) {

        '<div class="board-score">' + escapeHtml(e.nickname) + ' · 🏅 Level ' + lvl + '</div>' +

  $simonContent.innerHTML =

      '<button class="btn-primary" id="simon-retry-btn">Nochmal spielen</button>' +

Array.from($modeRow.children).forEach(btn => {
  btn.addEventListener('click', () => {
    settings.mode = btn.dataset.mode;
    saveState();
    renderSettings();
    renderBestNote();
  });
});
$changeNicknameBtn.addEventListener('click', renameNickname);
const TABS = [
  { btn: $tabPlay, view: $playView },
  { btn: $tabBoard, view: $boardView },
  { btn: $tabMemory, view: $memoryView },
  { btn: $tabCardMemory, view: $cardMemoryView },
  { btn: $tabMahjong, view: $mahjongView },
  { btn: $tabSimon, view: $simonView },
];
function switchTab(index) {
  TABS.forEach((t, i) => {
    t.btn.classList.toggle('active', i === index);
    t.view.classList.toggle('hidden', i !== index);
  });
  if (index !== 4) stopMahjongTimer();
  if (index !== 5) stopSimonTimer();
  if (index === 1) renderBoard();
  if (index === 2) renderMemoryView();
  if (index === 3) renderCardMemoryView();
  if (index === 4) renderMahjongView();
  if (index === 5) renderSimonView();
}
$tabPlay.addEventListener('click', () => switchTab(0));
$tabBoard.addEventListener('click', () => switchTab(1));
$tabMemory.addEventListener('click', () => switchTab(2));
$tabCardMemory.addEventListener('click', () => switchTab(3));
$tabMahjong.addEventListener('click', () => switchTab(4));
$tabSimon.addEventListener('click', () => switchTab(5));

/* ---------------- Init ---------------- */
renderSettings();
startRound();
</script>
</body>
</html>
